spring:
  application:
    name: turtle-soup-ai

server:
  port: 8080  # 服务端口

ai:
  qwen:
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    model: qwen-turbo
    # 建议通过环境变量 DASHSCOPE_API_KEY 注入，不要硬编码在这里
    api-key: ${DASHSCOPE_API_KEY:}
    connect-timeout: 5000
    read-timeout: 30000
    temperature: 0.1

logging:
  level:
    root: INFO
    com.example.turtle_soup_ai: INFO
